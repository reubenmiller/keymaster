name: Release Touchie

on:
  push:
    tags:
      - '*.*.*' # Trigger on SemVer tags

jobs:
  build-and-release:
    name: Build and Create GitHub Release
    runs-on: macos-latest # Needs macOS to build Swift CLI
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      sha256: ${{ steps.calculate_sha.outputs.sha256_value }}
      tarball_url: ${{ steps.get_tarball_url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Touchie binary
        run: swiftc touchie.swift -o touchie

      - name: Create Release Tarball URL
        id: get_tarball_url
        run: echo "url=https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.get_version.outputs.version }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Download release tarball
        run: curl -L -o touchie-${{ steps.get_version.outputs.version }}.tar.gz ${{ steps.get_tarball_url.outputs.url }}

      - name: Calculate SHA256
        id: calculate_sha
        run: echo "sha256_value=$(shasum -a 256 touchie-${{ steps.get_version.outputs.version }}.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create ${{ steps.get_version.outputs.version }} \
            --title "Release ${{ steps.get_version.outputs.version }}" \
            --notes "Release notes for Touchie version ${{ steps.get_version.outputs.version }}." \
            touchie # Upload the built binary as an asset
            # GitHub automatically adds source code zip and tar.gz

      - name: Suggest next version numbers
        run: |
          current_version="${{ steps.get_version.outputs.version }}"
          # Remove 'v' prefix for calculations
          version_no_v="${current_version#v}"
          IFS='.' read -r major minor patch <<< "$version_no_v"

          next_patch_version="v$major.$minor.$((patch + 1))"
          next_minor_version="v$major.$((minor + 1)).0"
          next_major_version="v$((major + 1)).0.0"

          echo "--------------------------------------------------"
          echo "Current version released: $current_version"
          echo "Suggested next patch version: $next_patch_version"
          echo "Suggested next minor version: $next_minor_version"
          echo "Suggested next major version: $next_major_version"
          echo "--------------------------------------------------"

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: build-and-release
    runs-on: ubuntu-latest # Git and awk operations can run on Linux
    if: success() && needs.build-and-release.outputs.version && needs.build-and-release.outputs.sha256

    steps:
      - name: Checkout Homebrew tap repository
        uses: actions/checkout@v4
        with:
          repository: reubenmiller/homebrew-touchie
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap # Checkout to a specific path

      - name: Update Homebrew formula
        working-directory: ./homebrew-tap/Formula
        env:
          NEW_VERSION_TAG: ${{ needs.build-and-release.outputs.version }} # e.g., v1.0.1
          NEW_SHA256: ${{ needs.build-and-release.outputs.sha256 }}
        run: |
          echo "Updating formula to version $NEW_VERSION_TAG with SHA256 $NEW_SHA256"
          # This awk script updates the url and sha256 lines in the formula.
          # It's designed to handle the initial placeholder SHA and subsequent updates.
          awk -v ver_tag="$NEW_VERSION_TAG" -v sha="$NEW_SHA256" '
            /url "/ { gsub(/refs\/tags\/v[0-9A-Za-z.-]+(\.tar\.gz)?/, "refs/tags/" ver_tag ".tar.gz"); print; next }
            /sha256 "/ { gsub(/sha256 ".+"/, "sha256 \"" sha "\""); print; next }
            { print }
          ' touchie.rb > touchie.rb.tmp && mv touchie.rb.tmp touchie.rb

          echo "Formula after update:"
          cat touchie.rb

      - name: Commit and push changes to Homebrew tap
        working-directory: ./homebrew-tap
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/touchie.rb
          if git diff --staged --quiet; then
            echo "No changes to commit to Homebrew tap."
          else
            git commit -m "Update touchie to version ${{ needs.build-and-release.outputs.version }}"
            git push
            echo "Changes pushed to Homebrew tap."
          fi